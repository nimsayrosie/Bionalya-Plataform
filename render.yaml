# Bionalya — receita da hospedagem no Render (plano grátis).
#
# Com este arquivo na raiz do repositório, o Render monta o serviço sozinho:
# em dashboard.render.com, "New" > "Blueprint", aponte para o repositório e ele
# lê daqui. Não pede cartão.
#
# O que esperar do plano grátis:
#   · 750 horas de instância por mês (uma instância ligada o mês inteiro cabe)
#   · dorme depois de 15 minutos sem acesso; a primeira visita depois disso
#     leva cerca de 1 minuto para acordar
#   · o disco é descartável: a cada reinício o que está nele volta do zero
#
# Por causa do disco, os dados ficam num PostgreSQL fora do Render, no Neon
# (neon.com), que é grátis e não tem prazo. O Postgres grátis do próprio Render
# NÃO serve: ele é apagado 30 dias depois de criado se ninguém pagar.
# Usuários, sessões, bases, modelos treinados, notificações — e até os CSVs
# enviados e os .joblib — vão para o Neon; na partida, a API recria no disco o
# que estiver faltando. Passo a passo em docs/banco-e-hospedagem.md.

services:
  - type: web
    name: bionalya
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./plataforma/Dockerfile
    dockerContext: .
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      # Onde fica o banco: o endereço de conexão do Neon. sync: false faz o
      # Render pedir o valor na hora de criar o serviço (ele não fica escrito
      # aqui porque tem a senha do banco dentro).
      - key: DATABASE_URL
        sync: false

      # Conta de admin. O e-mail você escolhe; a senha o Render sorteia na
      # primeira vez (generateValue) e guarda — dá para ler no painel, em
      # Environment, depois do primeiro deploy.
      - key: BIONALYA_ADMIN_EMAIL
        value: equipe@bionalya.app
      - key: BIONALYA_ADMIN_SENHA
        generateValue: true

      # Conta aberta de demonstração, para mandar o link para a banca sem dar
      # acesso de equipe. Apague estas três linhas se não quiser.
      - key: BIONALYA_DEMO_EMAIL
        value: demo@bionalya.app
      - key: BIONALYA_DEMO_SENHA
        generateValue: true
      - key: BIONALYA_DEMO_NOME
        value: Acesso de demonstração
